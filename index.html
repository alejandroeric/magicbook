<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MagicBook</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#FFF9F3;
color:#2D2A32;
}

.screen{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
text-align:center;
}

.hidden{
display:none;
}

h1{
font-size:60px;
color:#8B6DF3;
}

button{
background:#8B6DF3;
color:white;
border:none;
padding:15px 30px;
border-radius:12px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

input, textarea{
width:300px;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

</style>
</head>

<body>

<div id="home" class="screen">

<h1>✨ MagicBook</h1>

<h2>
Cada niño merece ser el héroe de su propia historia
</h2>

<button onclick="mostrarHeroe()">
Crear una aventura
</button>

</div>

<div id="hero" class="screen hidden">

<h1>✨ Crear Héroe</h1>

<input type="text" placeholder="Nombre">

<input type="number" placeholder="Edad">

<textarea placeholder="¿Qué le gusta?"></textarea>

<textarea placeholder="¿Qué lo hace especial?"></textarea>

<button onclick="alert('¡Próxima pantalla: Crear Historia!')">
Continuar
</button>

</div>

<script>

function mostrarHeroe(){
document.getElementById('home').classList.add('hidden');
document.getElementById('hero').classList.remove('hidden');
}

</script>

</body>
</html>
