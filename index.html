<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MagicBook</title>

<style>
body{
  font-family: Arial;
  background:#FFF9F3;
  text-align:center;
  padding-top:100px;
}

button{
  background:#8B6DF3;
  color:white;
  border:none;
  padding:15px 25px;
  border-radius:10px;
  font-size:18px;
}
</style>

</head>

<body>

<div id="home">
  <h1>✨ MagicBook</h1>
  <h2>Cada niño merece ser el héroe de su propia historia</h2>

  <button onclick="mostrarHeroe()">
    Crear una aventura
  </button>
</div>

<div id="hero" style="display:none;">
  <h1>✨ Crear Héroe</h1>

  <p>Nombre</p>
  <input>

  <p>Edad</p>
  <input type="number">

  <br><br>

  <button>
    Continuar
  </button>
</div>

<script>
function mostrarHeroe() {
  document.getElementById("home").style.display = "none";
  document.getElementById("hero").style.display = "block";
}
</script>

</body>
</html>
